name: Moog's Phone navigation fix checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/navigation-contacts-recents]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android data integration
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt
          grep -q 'android.permission.READ_CONTACTS' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_CALL_LOG' android/app/src/main/AndroidManifest.xml
          grep -q 'getContacts' android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt
          grep -q 'getRecents' android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt
          grep -q 'setFavorite' android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt

  android-debug-apk:
    runs-on: ubuntu-latest
    needs: flutter-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - run: flutter pub get
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android Gradle wrapper
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cd android
          gradle wrapper --gradle-version 8.7
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: moogs-phone-navigation-fix-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
