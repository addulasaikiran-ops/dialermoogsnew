name: Moog's Phone system checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/android-dialer-foundation]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Prepare Manrope font assets
        run: |
          mkdir -p assets/fonts assets/images
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o /tmp/Manrope.ttf
          for weight in ExtraLight Light Regular Medium Bold; do cp /tmp/Manrope.ttf "assets/fonts/Manrope-$weight.ttf"; done

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none lib test

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded

  android-source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project declarations
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt
          test -f android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt
          grep -q 'android.telecom.InCallService' android/app/src/main/AndroidManifest.xml
          grep -q 'fun answer()' android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt
          grep -q 'fun disconnect()' android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt
