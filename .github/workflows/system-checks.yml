name: Moog's Phone system checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/android-dialer-foundation]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none lib test

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded

  android-source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project declarations
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt
          test -f android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt
          grep -q 'android.telecom.InCallService' android/app/src/main/AndroidManifest.xml
          grep -q 'fun answer()' android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt
          grep -q 'fun disconnect()' android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt

  android-debug-apk:
    runs-on: ubuntu-latest
    needs: flutter-quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Prepare Android Gradle wrapper
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cd android
          gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moogs-phone-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
