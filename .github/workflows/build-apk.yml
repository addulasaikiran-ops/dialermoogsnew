name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Manrope fonts and assets
        run: bash tool/prepare_assets.sh

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          protected_files=(
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/kotlin/com/moogs/phone/MainActivity.kt
            android/app/src/main/kotlin/com/moogs/phone/MoogsInCallService.kt
            android/build.gradle.kts
            android/app/build.gradle.kts
          )
          for file in "${protected_files[@]}"; do
            test -f "$file" || { echo "::error::Required Android file is missing: $file"; exit 1; }
          done

          sha256sum "${protected_files[@]}" > /tmp/android-protected-files.sha256

          # First try the existing Android project unchanged.
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/flutter-build-first-attempt.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            # This repository intentionally has no Gradle wrapper checked in.
            # Generate only missing Android platform scaffolding when the
            # initial build cannot proceed because wrapper files are absent.
            if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
              echo "Initial build failed and Android Gradle wrapper files are missing; generating Android scaffolding."
              flutter create --platforms=android --project-name moogs_phone .

              sha256sum --check /tmp/android-protected-files.sha256
              git diff --exit-code -- "${protected_files[@]}"

              flutter build apk --debug
            else
              echo "::error::Initial APK build failed although the Gradle wrapper files exist."
              cat /tmp/flutter-build-first-attempt.log
              exit "$build_status"
            fi
          fi

          apk_path=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk_path"
          echo "APK path: $apk_path"
          echo "APK size: $(du -h "$apk_path" | cut -f1) ($(stat -c '%s' "$apk_path") bytes)"
          application_id="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          test "$application_id" = "com.moogs.phone"
          echo "Application ID: $application_id"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moogs-phone-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
